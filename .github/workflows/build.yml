name: Build NetworkPainterServer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build NetworkPainterServer.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: NetworkPainterServer
          path: bin/Release/netstandard2.1/NetworkPainterServer.dll
